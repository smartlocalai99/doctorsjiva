<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#2E7EBC" />
    <title>DRJIVA Doctors · Offline</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f7f8;color:#183142;font-family:system-ui,sans-serif}.card{max-width:440px;padding:32px;border:1px solid #dfe7eb;border-radius:24px;background:#fff;text-align:center;box-shadow:0 18px 50px rgba(29,57,76,.08)}.mark{width:56px;height:56px;display:grid;place-items:center;margin:auto;border-radius:18px;background:#e7f2fa;color:#2e7ebc;font-size:28px;font-weight:800}h1{margin:20px 0 8px;font-size:28px}p{margin:0;color:#667784;line-height:1.6}button{margin-top:24px;padding:12px 18px;border:0;border-radius:12px;background:#2e7ebc;color:white;font-weight:700;cursor:pointer}
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark">+</div>
      <h1>You are offline</h1>
      <p>Reconnect to publish or sync your doctor workspace. Your browser will keep the app ready.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
